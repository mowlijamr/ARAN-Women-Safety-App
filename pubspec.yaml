name: women_safety
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  url_launcher: ^6.2.5
  audioplayers: ^6.0.0
  flutter_secure_storage: ^9.0.0
  uuid: ^4.2.1
  torch_light: ^1.0.1
  image_picker: ^1.0.7
  telephony: ^0.2.0
  sensors_plus: ^6.1.0
  gal: ^2.3.3
  path_provider: ^2.1.2
  firebase_core: ^3.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/aran_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/aran_logo.png
    - assets/audio/siren.mp3
